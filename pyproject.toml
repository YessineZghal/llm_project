[project]
name = "llm-project"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "altair>=5.5.0",
    "beautifulsoup4>=4.15.0",
    "elasticsearch>=8.19,<9",
    "kestra>=1.3.0",
    "minsearch>=0.2.0",
    "numpy>=2.5.1",
    "openai>=2.52.0",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.1",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.60.0",
    "toyaikit>=0.0.11",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_project"]
