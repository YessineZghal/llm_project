[project]
name = "llm-project"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "altair>=5.5.0",
    "beautifulsoup4>=4.15.0",
    "elasticsearch>=8.19,<9",
    "kestra>=1.3.0",
    "minsearch>=0.2.0",
    "numpy>=2.5.1",
    "openai>=2.52.0",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.1",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.60.0",
    "toyaikit>=0.0.11",
    "torch>=2.0.0",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]

# torch (pulled in transitively by sentence-transformers, for embeddings/reranking
# inference only - this project never uses a GPU) resolves the full CUDA toolkit
# on Linux by default (cuda-bindings, cudnn, nccl, triton, ...), ballooning the
# Docker image to ~9GB and exhausting CI runners' disk space. PyTorch's own
# CPU-only wheel index publishes current versions for every platform this
# project runs on (Linux and macOS arm64), so this applies uniformly - not
# just a Linux-only override.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_project"]
