[project]
name = "llm-project"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dlt>=1.29.1",
    "duckdb>=1.5.5",
    "elasticsearch>=8.19,<9",
    "fastapi>=0.141.1",
    "kestra>=1.3.0",
    "langchain>=1.3.14",
    "langchain-elasticsearch>=1.0.0",
    "langchain-huggingface>=1.2.2",
    "minsearch>=0.2.0",
    "numpy>=2.5.1",
    "onnxruntime>=1.28.0",
    "openai>=2.52.0",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.1",
    "sqlalchemy>=2.0.51",
    "sqlitesearch>=0.1.2",
    "streamlit>=1.60.0",
    "tokenizers>=0.22.2",
    "toyaikit>=0.0.11",
    "tqdm>=4.70.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_project"]
